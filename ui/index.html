<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Draw.io Canvas</title>
		<link rel="stylesheet" href="ui/host.css" />
	</head>
	<body>
		<header id="bar">
			<span class="brand">Draw.io Canvas</span>
			<span class="file" id="file" title="Workspace file">untitled</span>
			<span class="status" id="status" aria-live="polite">starting…</span>
			<span class="spacer"></span>
			<span class="peer" id="peer" title="What the agent last did"></span>
			<button id="open-file" title="Open a .drawio file from the workspace">Open…</button>
			<button id="save-file" title="Save to the workspace (Ctrl+S)">Save</button>
			<button id="history" title="Every version, by you or the agent">History</button>
		</header>
		<main id="stage">
			<section id="loading">
				<h1>Preparing the editor</h1>
				<p id="loading-text">Checking for draw.io…</p>
				<progress id="loading-progress" max="1" value="0" hidden></progress>
				<p class="muted" id="loading-hint"></p>
			</section>
			<iframe id="editor" title="draw.io editor" hidden></iframe>
		</main>
		<div class="sheet" id="sheet" hidden>
			<div class="sheet-body" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
				<h2 id="sheet-title">Title</h2>
				<div id="sheet-content"></div>
				<div class="sheet-actions">
					<button id="sheet-cancel">Cancel</button>
					<button class="primary" id="sheet-confirm">OK</button>
				</div>
			</div>
		</div>
		<script type="module" src="ui/host.mjs"></script>
	</body>
</html>
